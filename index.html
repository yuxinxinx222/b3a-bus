<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7fb">
<title>B3A · Fu Tai ⇄ Shenzhen Bay Port</title>
<style>
  :root{
    --ink:#33232c;
    --muted:#8f7385;
    --dim:#b9a3b0;
    --rose:#d65b8a;
    --rose-deep:#b83f6e;
    --lilac:#a06bd0;
    --card:rgba(255,255,255,.78);
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 620px at 6% -12%, #ffe1ed 0%, transparent 60%),
      radial-gradient(880px 600px at 98% 0%, #eadcff 0%, transparent 58%),
      radial-gradient(720px 500px at 50% 114%, #ffe7d6 0%, transparent 62%),
      linear-gradient(180deg,#fffbfd 0%,#fff7fb 100%);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:30px 18px 40px;
  }
  /* 极淡网格 */
  body::before{
    content:"";
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(214,91,138,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(214,91,138,.04) 1px, transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(circle at 50% 26%, #000 0%, transparent 76%);
    mask-image:radial-gradient(circle at 50% 26%, #000 0%, transparent 76%);
  }
  /* 缓慢漂移的柔光 */
  body::after{
    content:"";
    position:fixed;inset:-18%;z-index:0;pointer-events:none;
    background:
      radial-gradient(38% 38% at 28% 28%, rgba(255,171,205,.42), transparent 70%),
      radial-gradient(34% 34% at 72% 62%, rgba(178,148,255,.32), transparent 70%),
      radial-gradient(30% 30% at 55% 85%, rgba(255,196,164,.30), transparent 70%);
    filter:blur(46px);
    animation:drift 20s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{transform:translate3d(-2%,-1%,0) scale(1)}
    to{transform:translate3d(2%,2%,0) scale(1.04)}
  }

  .wrap{width:100%;max-width:940px;position:relative;z-index:1}

  /* ---------- 顶部日期 ---------- */
  .masthead{text-align:center;margin-bottom:22px}
  .eyebrow{
    font-family:var(--mono);
    font-size:10px;font-weight:700;letter-spacing:3.4px;text-transform:uppercase;
    background:linear-gradient(90deg,#c74a7c,#a06bd0);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    margin-bottom:10px;
  }
  .date-en{
    font-size:clamp(19px,3.4vw,26px);
    font-weight:650;
    letter-spacing:.14em;
    background:linear-gradient(140deg,#b83f6e 0%,#d9709f 42%,#8f63cc 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    line-height:1.25;
  }
  .date-cn{
    margin-top:7px;
    font-size:13px;letter-spacing:.34em;color:var(--muted);
  }
  .rule{
    width:54px;height:2px;margin:16px auto 0;border-radius:2px;
    background:linear-gradient(90deg,transparent,#e9a3c1,#b99ad9,transparent);
  }

  /* ---------- 卡片 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}

  .card{
    position:relative;
    border:1px solid transparent;
    border-radius:22px;
    padding:22px 22px 16px;
    background:
      linear-gradient(var(--card),var(--card)) padding-box,
      linear-gradient(135deg,#ffd2e4 0%,#e7d6ff 48%,#ffe2cf 100%) border-box;
    box-shadow:
      0 2px 4px rgba(184,63,110,.04),
      0 22px 50px rgba(160,107,208,.13);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,#ffb3ce,#d65b8a 40%,#a06bd0 78%,#ffd0b8);
    opacity:.85;
  }

  .top{display:flex;align-items:flex-start;gap:12px}
  .route{
    flex:none;
    font-family:var(--mono);
    font-size:21px;font-weight:700;letter-spacing:1px;line-height:1;
    padding:9px 13px;border-radius:12px;
    color:#fff;
    background:linear-gradient(135deg,#f6a6c0 0%,#d65b8a 55%,#b03e74 100%);
    box-shadow:0 8px 20px rgba(214,91,138,.30), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .dest{min-width:0;flex:1}
  .kind{
    font-family:var(--mono);
    font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;
    background:linear-gradient(90deg,#c74a7c,#a06bd0);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    margin-bottom:4px;
  }
  .dest .leg{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--muted);line-height:1.35}
  .dest .leg .lbl{
    flex:none;width:32px;font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;color:var(--dim);
  }
  .dest .leg.to{font-size:16px;font-weight:700;color:var(--ink)}

  .hero{text-align:center;padding:16px 0 6px}
  .hero .label{
    font-family:var(--mono);
    font-size:10.5px;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .hero .big{
    font-family:var(--mono);
    font-size:clamp(62px,13vw,100px);
    font-weight:800;line-height:1.02;margin-top:6px;
    letter-spacing:-2px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(150deg,#c74a7c 0%,#e9709b 46%,#9b6bd6 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 8px 22px rgba(184,63,110,.16));
  }
  .hero .big.due{
    font-size:clamp(42px,9vw,60px);
    letter-spacing:0;
    background:none;color:var(--rose-deep);-webkit-text-fill-color:var(--rose-deep);
    filter:none;
  }
  .hero .unit{
    font-family:var(--mono);
    font-size:15px;color:var(--muted);font-weight:600;margin-top:4px;
    letter-spacing:1px;
  }
  .hero .at{font-size:12.5px;color:var(--dim);margin-top:8px;font-family:var(--mono);letter-spacing:.4px}

  .pill{
    display:inline-block;font-family:var(--mono);
    font-size:10px;font-weight:700;letter-spacing:.4px;
    padding:2px 8px;border-radius:6px;margin-left:7px;
    background:linear-gradient(180deg,#fff3f8,#ffe8f2);
    color:var(--rose-deep);
    border:1px solid #ffd2e4;
    vertical-align:middle;white-space:nowrap;
  }

  .list{margin-top:12px;border-top:1px solid #f6e6ef;padding-top:4px}
  .row{
    display:flex;align-items:baseline;gap:9px;
    padding:10px 3px;border-bottom:1px solid #faf0f5;
  }
  .row:last-child{border-bottom:0}
  .row .n{
    width:20px;flex:none;font-family:var(--mono);
    color:var(--dim);font-size:12px;font-weight:700;
  }
  .row .min{
    font-family:var(--mono);font-size:20px;font-weight:700;
    font-variant-numeric:tabular-nums;min-width:80px;color:var(--ink);
  }
  .row .min small{font-size:11px;color:var(--muted);font-weight:600;margin-left:3px}
  .row .clock{
    margin-left:auto;font-family:var(--mono);
    color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;
  }
  .empty{color:var(--muted);font-size:13px;padding:12px 3px;font-family:var(--mono)}

  .note{
    margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--dim);
    border-top:1px dashed #f3e2ec;padding-top:9px;
  }

  .err-box{
    display:none;margin-top:10px;padding:11px 12px;border-radius:11px;
    background:linear-gradient(180deg,#fff1f5,#ffe9f1);
    border:1px solid #ffc9da;
    color:#b83f5e;font-size:12.5px;line-height:1.45;
  }

  .foot{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-top:22px;font-family:var(--mono);font-size:12px;color:var(--muted);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#f6a6c0,#d65b8a);
    box-shadow:0 0 0 0 rgba(214,91,138,.42);
    animation:pulse 2.2s infinite;
  }
  .dot.err{background:#e0455f;animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(214,91,138,.42)}
    70%{box-shadow:0 0 0 9px rgba(214,91,138,0)}
    100%{box-shadow:0 0 0 0 rgba(214,91,138,0)}
  }
  .sp{width:12px}
  button{
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;
    color:var(--rose-deep);
    background:linear-gradient(180deg,#ffffff,#fff6fa);
    border:1px solid #ffd2e4;border-radius:9px;
    padding:6px 12px;letter-spacing:.4px;
    transition:box-shadow .18s, border-color .18s, transform .18s;
  }
  button:hover{
    border-color:#e9a3c1;
    box-shadow:0 8px 20px rgba(214,91,138,.16);
    transform:translateY(-1px);
  }
  button:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}

  .src{
    margin-top:14px;text-align:center;font-family:var(--mono);
    font-size:10.5px;line-height:1.6;color:#c9b0bd;
  }

  @media (prefers-reduced-motion: reduce){
    body::after,.dot{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="eyebrow">Citybus · B3A</div>
    <div class="date-en" id="dateEn">—</div>
    <div class="date-cn" id="dateCn"></div>
    <div class="rule"></div>
  </header>

  <div class="grid" id="app"></div>

  <div class="foot">
    <span class="dot" id="dot"></span>
    <span id="status">CONNECTING…</span>
    <span class="sp"></span>
    <span id="nextrefresh"></span>
    <button id="refresh" type="button">REFRESH</button>
  </div>

  <div class="src">
    CITYBUS B3A · OPEN DATA: RT.DATA.GOV.HK (DATA.GOV.HK) · AUTO-REFRESH 60s<br>
    OUT 003261 FU TAI ESTATE → SHENZHEN BAY PORT &nbsp;|&nbsp;
    RET 003208 SHENZHEN BAY PORT → SHAN KING ESTATE (VIA 003262)
  </div>
</div>

<script>
(function () {
  "use strict";

  var CO = "CTB";
  var ROUTE = "B3A";
  var API = "https://rt.data.gov.hk/v2/transport/citybus/eta/" + CO + "/";
  var REFRESH_MS = 60000;

  var LEGS = [
    {
      key: "out",
      kind: "去程 · Outbound",
      from: "Fu Tai Estate · 富泰邨",
      to: "Shenzhen Bay Port · 深圳湾口岸",
      stop: "003261",
      dir: "O",
      dest: "Shenzhen Bay Port",
      note: ""
    },
    {
      key: "ret",
      kind: "回程 · Return",
      from: "Shenzhen Bay Port · 深圳湾口岸",
      to: "Fu Tai · 富泰",
      stop: "003208",
      dir: "I",
      dest: "Shan King Estate",
      note: "Return direction terminates at Shan King Estate (山景邨). Nearest stop " +
            "to Fu Tai Estate is Fu Tai Shopping Centre · 富泰商场 (003262)."
    }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var busy = false, lastUpdate = null, nextFetchAt = 0, lastDay = "";

  /* ---------- 日期 ---------- */
  var DAY_EN = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  var MON_EN = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY",
                "AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
  var DAY_CN = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

  function paintDate() {
    var d = new Date();
    var key = d.toDateString();
    if (key === lastDay) return;
    lastDay = key;
    $("dateEn").textContent =
      DAY_EN[d.getDay()] + " · " + d.getDate() + " " + MON_EN[d.getMonth()] + " " + d.getFullYear();
    $("dateCn").textContent =
      DAY_CN[d.getDay()] + " · " + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  /* ---------- 构建卡片 ---------- */
  var app = $("app");
  LEGS.forEach(function (leg) {
    var sec = document.createElement("section");
    sec.className = "card";
    sec.innerHTML =
      '<div class="top">' +
        '<div class="route">' + ROUTE + '</div>' +
        '<div class="dest">' +
          '<div class="kind">' + leg.kind + '</div>' +
          '<div class="leg"><span class="lbl">From</span><span>' + leg.from + '</span></div>' +
          '<div class="leg to"><span class="lbl">To</span><span>' + leg.to + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="hero">' +
        '<div class="label">Next B3A</div>' +
        '<div class="big">–</div>' +
        '<div class="unit">minutes</div>' +
        '<div class="at"></div>' +
      '</div>' +
      '<div class="list"></div>' +
      '<div class="err-box"></div>' +
      (leg.note ? '<div class="note">' + leg.note + '</div>' : '');

    app.appendChild(sec);

    leg.etas = [];
    leg.ui = {
      big:  sec.querySelector(".big"),
      unit: sec.querySelector(".unit"),
      at:   sec.querySelector(".at"),
      list: sec.querySelector(".list"),
      err:  sec.querySelector(".err-box")
    };
  });

  function clockOf(ms) {
    var d = new Date(ms);
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }
  function minsUntil(ms) { return (ms - Date.now()) / 60000; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function badge(rmk) {
    return rmk ? '<span class="pill">' + esc(rmk) + "</span>" : "";
  }

  function fetchAll() {
    if (busy) return;
    busy = true;
    $("refresh").disabled = true;

    var jobs = LEGS.map(function (leg) {
      return fetch(API + leg.stop + "/" + ROUTE, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (json) {
          leg.etas = ((json && json.data) || [])
            .filter(function (e) {
              return e.dir === leg.dir && e.dest_en === leg.dest && e.eta;
            })
            .map(function (e) {
              return { ms: new Date(e.eta).getTime(), rmk: e.rmk_en || e.rmk_tc || "" };
            })
            .filter(function (e) { return !isNaN(e.ms); })
            .sort(function (a, b) { return a.ms - b.ms; });
          leg.ok = true;
          leg.ui.err.style.display = "none";
        })
        .catch(function (err) {
          leg.ok = false;
          leg.ui.err.style.display = "block";
          leg.ui.err.textContent =
            "SIGNAL LOST — could not reach Citybus open data (" + err.message +
            "). Showing last known times.";
        });
    });

    Promise.all(jobs).then(function () {
      lastUpdate = new Date();
      nextFetchAt = Date.now() + REFRESH_MS;
      $("dot").classList.toggle("err", !LEGS.every(function (l) { return l.ok; }));
      tick();
      busy = false;
      $("refresh").disabled = false;
    });
  }

  function renderLeg(leg) {
    var ui = leg.ui, etas = leg.etas;

    if (!etas.length) {
      ui.big.textContent = "–";
      ui.big.classList.remove("due");
      ui.unit.textContent = "no buses scheduled";
      ui.at.textContent = "";
      ui.list.innerHTML = '<div class="empty">NO UPCOMING BUSES AT THIS STOP</div>';
      return;
    }

    var first = etas[0];
    var m = minsUntil(first.ms);

    if (m <= 0.5) {
      ui.big.textContent = "DUE";
      ui.big.classList.add("due");
      ui.unit.innerHTML = badge(first.rmk);
      ui.at.textContent = "ARRIVING NOW";
    } else {
      ui.big.classList.remove("due");
      ui.big.textContent = Math.floor(m);
      ui.unit.innerHTML = "minutes" + badge(first.rmk);
      ui.at.textContent = "expected " + clockOf(first.ms);
    }

    var html = "";
    etas.slice(0, 4).forEach(function (e, i) {
      var mm = minsUntil(e.ms);
      var label = mm <= 0.5 ? "DUE" : Math.floor(mm) + "<small>min</small>";
      html += '<div class="row">' +
                '<span class="n">' + (i + 1) + "</span>" +
                '<span class="min">' + label + badge(e.rmk) + "</span>" +
                '<span class="clock">' + clockOf(e.ms) + "</span>" +
              "</div>";
    });
    ui.list.innerHTML = html;
  }

  function tick() {
    paintDate();
    if (!lastUpdate) return;
    LEGS.forEach(renderLeg);

    $("status").textContent =
      ($("dot").classList.contains("err") ? "PARTIAL DATA" : "LIVE") +
      " · UPDATED " +
      String(lastUpdate.getHours()).padStart(2, "0") + ":" +
      String(lastUpdate.getMinutes()).padStart(2, "0") + ":" +
      String(lastUpdate.getSeconds()).padStart(2, "0");

    var left = Math.max(0, Math.ceil((nextFetchAt - Date.now()) / 1000));
    $("nextrefresh").textContent = "NEXT IN " + left + "s";
  }

  $("refresh").addEventListener("click", fetchAll);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) fetchAll();
  });

  paintDate();
  fetchAll();
  setInterval(tick, 1000);
  setInterval(fetchAll, REFRESH_MS);
})();
</script>
</body>
</html>
