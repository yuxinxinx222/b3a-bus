<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7fa">
<title>B3A · Fu Tai ⇄ Shenzhen Bay Port</title>
<style>
  :root{
    --bg:#fff7fa;
    --panel:#ffffff;
    --text:#3b2430;
    --muted:#9b7a8c;
    --pink:#e75a8a;
    --pink-deep:#d34a7c;
    --pink-soft:#ffd9e6;
    --line:#ffe1ec;
    --dim:#b79aa8;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1000px 620px at 8% -12%, #ffe4ef 0%, transparent 62%),
      radial-gradient(900px 600px at 100% 0%, #f4e8ff 0%, transparent 58%),
      radial-gradient(760px 480px at 50% 118%, #ffe9f2 0%, transparent 65%),
      var(--bg);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:26px 18px 36px;
  }
  /* 很淡的网格，保留一点科技感 */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(231,90,138,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(231,90,138,.045) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
    mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  }

  .wrap{width:100%;max-width:940px;position:relative;z-index:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px}

  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 22px 16px;
    box-shadow:
      0 1px 2px rgba(180,80,120,.05),
      0 18px 44px rgba(200,110,150,.13);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0 0 auto 0; height:3px;
    background:linear-gradient(90deg, #ffd9e6, var(--pink) 45%, #d9c2ff);
  }

  .top{display:flex;align-items:flex-start;gap:12px}
  .route{
    flex:none;
    font-family:var(--mono);
    font-size:21px;font-weight:700;letter-spacing:1px;line-height:1;
    padding:8px 12px;border-radius:11px;
    color:#fff;
    background:linear-gradient(135deg,#ff9ec4,var(--pink));
    box-shadow:0 6px 16px rgba(231,90,138,.28), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .dest{min-width:0;flex:1}
  .kind{
    font-family:var(--mono);
    font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--pink);margin-bottom:4px;
  }
  .dest .leg{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--muted);line-height:1.35}
  .dest .leg .lbl{
    flex:none;width:32px;font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;color:var(--dim);
  }
  .dest .leg.to{font-size:16px;font-weight:700;color:var(--text)}

  .hero{text-align:center;padding:16px 0 6px}
  .hero .label{
    font-family:var(--mono);
    font-size:10.5px;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .hero .big{
    font-family:var(--mono);
    font-size:clamp(62px,13vw,98px);
    font-weight:800;line-height:1.02;margin-top:6px;
    letter-spacing:-2px;
    font-variant-numeric:tabular-nums;
    color:var(--pink-deep);
    text-shadow:0 8px 26px rgba(231,90,138,.18);
  }
  .hero .big.due{
    font-size:clamp(42px,9vw,60px);
    letter-spacing:0;
    color:var(--pink);
  }
  .hero .unit{
    font-family:var(--mono);
    font-size:15px;color:var(--muted);font-weight:600;margin-top:4px;
    letter-spacing:1px;
  }
  .hero .at{font-size:12.5px;color:var(--dim);margin-top:8px;font-family:var(--mono);letter-spacing:.4px}

  .pill{
    display:inline-block;font-family:var(--mono);
    font-size:10px;font-weight:700;letter-spacing:.4px;
    padding:2px 8px;border-radius:6px;margin-left:7px;
    background:#fff0f6;color:var(--pink-deep);
    border:1px solid var(--pink-soft);
    vertical-align:middle;white-space:nowrap;
  }

  .list{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
  .row{
    display:flex;align-items:baseline;gap:9px;
    padding:10px 3px;border-bottom:1px solid #f9edf3;
  }
  .row:last-child{border-bottom:0}
  .row .n{
    width:20px;flex:none;font-family:var(--mono);
    color:var(--dim);font-size:12px;font-weight:700;
  }
  .row .min{
    font-family:var(--mono);font-size:20px;font-weight:700;
    font-variant-numeric:tabular-nums;min-width:80px;color:var(--text);
  }
  .row .min small{font-size:11px;color:var(--muted);font-weight:600;margin-left:3px}
  .row .clock{
    margin-left:auto;font-family:var(--mono);
    color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;
  }
  .empty{color:var(--muted);font-size:13px;padding:12px 3px;font-family:var(--mono)}

  .note{
    margin-top:10px;font-size:11.5px;line-height:1.5;color:var(--dim);
    border-top:1px dashed var(--line);padding-top:9px;
  }

  .err-box{
    display:none;margin-top:10px;padding:11px 12px;border-radius:10px;
    background:#fff0f4;border:1px solid #ffc9d9;
    color:#c0405f;font-size:12.5px;line-height:1.45;
  }

  .foot{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-top:20px;font-family:var(--mono);font-size:12px;color:var(--muted);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;flex:none;
    background:var(--pink);
    box-shadow:0 0 0 0 rgba(231,90,138,.45);
    animation:pulse 2.2s infinite;
  }
  .dot.err{background:#e0455f;animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(231,90,138,.45)}
    70%{box-shadow:0 0 0 9px rgba(231,90,138,0)}
    100%{box-shadow:0 0 0 0 rgba(231,90,138,0)}
  }
  .sp{width:12px}
  button{
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;
    color:var(--pink-deep);background:#fff;
    border:1px solid var(--pink-soft);border-radius:9px;
    padding:6px 12px;letter-spacing:.4px;
    transition:background .18s, box-shadow .18s, border-color .18s;
  }
  button:hover{
    background:#fff4f8;border-color:var(--pink);
    box-shadow:0 6px 16px rgba(231,90,138,.16);
  }
  button:disabled{opacity:.45;cursor:default;box-shadow:none}

  .src{
    margin-top:14px;text-align:center;font-family:var(--mono);
    font-size:10.5px;line-height:1.6;color:#c4a7b5;
  }

  @media (prefers-reduced-motion: reduce){
    .dot{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid" id="app"></div>

  <div class="foot">
    <span class="dot" id="dot"></span>
    <span id="status">CONNECTING…</span>
    <span class="sp"></span>
    <span id="nextrefresh"></span>
    <button id="refresh" type="button">REFRESH</button>
  </div>

  <div class="src">
    CITYBUS B3A · OPEN DATA: RT.DATA.GOV.HK (DATA.GOV.HK) · AUTO-REFRESH 60s<br>
    OUT 003261 FU TAI ESTATE → SHENZHEN BAY PORT &nbsp;|&nbsp;
    RET 003208 SHENZHEN BAY PORT → SHAN KING ESTATE (VIA 003262)
  </div>
</div>

<script>
(function () {
  "use strict";

  var CO = "CTB";
  var ROUTE = "B3A";
  var API = "https://rt.data.gov.hk/v2/transport/citybus/eta/" + CO + "/";
  var REFRESH_MS = 60000;

  var LEGS = [
    {
      key: "out",
      kind: "去程 · Outbound",
      from: "Fu Tai Estate · 富泰邨",
      to: "Shenzhen Bay Port · 深圳湾口岸",
      stop: "003261",
      dir: "O",
      dest: "Shenzhen Bay Port",
      note: ""
    },
    {
      key: "ret",
      kind: "回程 · Return",
      from: "Shenzhen Bay Port · 深圳湾口岸",
      to: "Fu Tai · 富泰",
      stop: "003208",
      dir: "I",
      dest: "Shan King Estate",
      note: "Return direction terminates at Shan King Estate (山景邨). Nearest stop " +
            "to Fu Tai Estate is Fu Tai Shopping Centre · 富泰商场 (003262)."
    }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var busy = false, lastUpdate = null, nextFetchAt = 0;

  var app = $("app");
  LEGS.forEach(function (leg) {
    var sec = document.createElement("section");
    sec.className = "card";
    sec.innerHTML =
      '<div class="top">' +
        '<div class="route">' + ROUTE + '</div>' +
        '<div class="dest">' +
          '<div class="kind">' + leg.kind + '</div>' +
          '<div class="leg"><span class="lbl">From</span><span>' + leg.from + '</span></div>' +
          '<div class="leg to"><span class="lbl">To</span><span>' + leg.to + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="hero">' +
        '<div class="label">Next B3A</div>' +
        '<div class="big">–</div>' +
        '<div class="unit">minutes</div>' +
        '<div class="at"></div>' +
      '</div>' +
      '<div class="list"></div>' +
      '<div class="err-box"></div>' +
      (leg.note ? '<div class="note">' + leg.note + '</div>' : '');

    app.appendChild(sec);

    leg.etas = [];
    leg.ui = {
      big:  sec.querySelector(".big"),
      unit: sec.querySelector(".unit"),
      at:   sec.querySelector(".at"),
      list: sec.querySelector(".list"),
      err:  sec.querySelector(".err-box")
    };
  });

  function clockOf(ms) {
    var d = new Date(ms);
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }
  function minsUntil(ms) { return (ms - Date.now()) / 60000; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function badge(rmk) {
    return rmk ? '<span class="pill">' + esc(rmk) + "</span>" : "";
  }

  function fetchAll() {
    if (busy) return;
    busy = true;
    $("refresh").disabled = true;

    var jobs = LEGS.map(function (leg) {
      return fetch(API + leg.stop + "/" + ROUTE, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (json) {
          leg.etas = ((json && json.data) || [])
            .filter(function (e) {
              return e.dir === leg.dir && e.dest_en === leg.dest && e.eta;
            })
            .map(function (e) {
              return { ms: new Date(e.eta).getTime(), rmk: e.rmk_en || e.rmk_tc || "" };
            })
            .filter(function (e) { return !isNaN(e.ms); })
            .sort(function (a, b) { return a.ms - b.ms; });
          leg.ok = true;
          leg.ui.err.style.display = "none";
        })
        .catch(function (err) {
          leg.ok = false;
          leg.ui.err.style.display = "block";
          leg.ui.err.textContent =
            "SIGNAL LOST — could not reach Citybus open data (" + err.message +
            "). Showing last known times.";
        });
    });

    Promise.all(jobs).then(function () {
      lastUpdate = new Date();
      nextFetchAt = Date.now() + REFRESH_MS;
      $("dot").classList.toggle("err", !LEGS.every(function (l) { return l.ok; }));
      tick();
      busy = false;
      $("refresh").disabled = false;
    });
  }

  function renderLeg(leg) {
    var ui = leg.ui, etas = leg.etas;

    if (!etas.length) {
      ui.big.textContent = "–";
      ui.big.classList.remove("due");
      ui.unit.textContent = "no buses scheduled";
      ui.at.textContent = "";
      ui.list.innerHTML = '<div class="empty">NO UPCOMING BUSES AT THIS STOP</div>';
      return;
    }

    var first = etas[0];
    var m = minsUntil(first.ms);

    if (m <= 0.5) {
      ui.big.textContent = "DUE";
      ui.big.classList.add("due");
      ui.unit.innerHTML = badge(first.rmk);
      ui.at.textContent = "ARRIVING NOW";
    } else {
      ui.big.classList.remove("due");
      ui.big.textContent = Math.floor(m);
      ui.unit.innerHTML = "minutes" + badge(first.rmk);
      ui.at.textContent = "expected " + clockOf(first.ms);
    }

    var html = "";
    etas.slice(0, 4).forEach(function (e, i) {
      var mm = minsUntil(e.ms);
      var label = mm <= 0.5 ? "DUE" : Math.floor(mm) + "<small>min</small>";
      html += '<div class="row">' +
                '<span class="n">' + (i + 1) + "</span>" +
                '<span class="min">' + label + badge(e.rmk) + "</span>" +
                '<span class="clock">' + clockOf(e.ms) + "</span>" +
              "</div>";
    });
    ui.list.innerHTML = html;
  }

  function tick() {
    if (!lastUpdate) return;
    LEGS.forEach(renderLeg);

    $("status").textContent =
      ($("dot").classList.contains("err") ? "PARTIAL DATA" : "LIVE") +
      " · UPDATED " +
      String(lastUpdate.getHours()).padStart(2, "0") + ":" +
      String(lastUpdate.getMinutes()).padStart(2, "0") + ":" +
      String(lastUpdate.getSeconds()).padStart(2, "0");

    var left = Math.max(0, Math.ceil((nextFetchAt - Date.now()) / 1000));
    $("nextrefresh").textContent = "NEXT IN " + left + "s";
  }

  $("refresh").addEventListener("click", fetchAll);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) fetchAll();
  });

  fetchAll();
  setInterval(tick, 1000);
  setInterval(fetchAll, REFRESH_MS);
})();
</script>
</body>
</html>
