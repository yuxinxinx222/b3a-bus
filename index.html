<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3A · Fu Tai ⇄ Shenzhen Bay Port</title>
<style>
  :root{
    --bg:#0b1020;
    --card:#161d33;
    --card2:#1d2743;
    --line:#2b3757;
    --text:#eef2ff;
    --muted:#93a0c4;
    --accent:#ffcc00;
    --accent2:#ff5c39;
    --good:#35d07f;
    --ret:#4cc9f0;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
                "PingFang TC","Microsoft JhengHei",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 600px at 12% -10%, #22305c 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #3a2350 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:26px 20px 34px;
  }
  .wrap{width:100%;max-width:940px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:20px;
  }

  .card{
    background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px 22px 16px;
    box-shadow:0 22px 55px rgba(0,0,0,.42);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;inset:0 0 auto 0;height:4px;
    background:linear-gradient(90deg,var(--tint),transparent 70%);
  }

  .top{display:flex;align-items:flex-start;gap:12px}
  .route{
    background:var(--accent);
    color:#1a1400;font-weight:800;font-size:22px;line-height:1;
    padding:7px 12px;border-radius:11px;flex:none;letter-spacing:.4px;
  }
  .dest{min-width:0;flex:1}
  .kind{
    font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--tint);margin-bottom:2px;
  }
  .dest .leg{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--muted);line-height:1.35}
  .dest .leg .lbl{
    flex:none;width:32px;font-size:9px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;color:#6b79a0;
  }
  .dest .leg.to{font-size:16px;font-weight:700;color:var(--text)}

  .hero{text-align:center;padding:18px 0 6px}
  .hero .label{
    font-size:11px;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .hero .big{
    font-size:clamp(60px,13vw,96px);font-weight:800;line-height:1;margin-top:4px;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 38px color-mix(in srgb, var(--tint) 30%, transparent);
  }
  .hero .big.due{font-size:clamp(42px,9vw,62px);color:var(--good);text-shadow:0 0 38px rgba(53,208,127,.3)}
  .hero .unit{font-size:16px;color:var(--muted);font-weight:600;margin-top:3px}
  .hero .at{font-size:12.5px;color:var(--muted);margin-top:8px}

  .pill{
    display:inline-block;font-size:10.5px;font-weight:700;
    padding:2px 8px;border-radius:999px;margin-left:7px;
    background:rgba(255,92,57,.18);color:#ff9b85;
    border:1px solid rgba(255,92,57,.35);
    vertical-align:middle;white-space:nowrap;
  }

  .list{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
  .row{
    display:flex;align-items:baseline;gap:9px;
    padding:10px 3px;border-bottom:1px solid rgba(43,55,87,.55);
  }
  .row:last-child{border-bottom:0}
  .row .n{width:20px;color:var(--muted);font-size:12.5px;font-weight:700;flex:none}
  .row .min{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;min-width:80px}
  .row .min small{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:3px}
  .row .clock{margin-left:auto;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:13.5px;padding:12px 3px}

  .note{
    margin-top:10px;font-size:11.5px;line-height:1.45;color:#7c8ab0;
    border-top:1px dashed rgba(43,55,87,.8);padding-top:9px;
  }

  .err-box{
    display:none;margin-top:10px;padding:11px 12px;border-radius:11px;
    background:rgba(255,92,57,.12);border:1px solid rgba(255,92,57,.35);
    color:#ffb3a3;font-size:12.5px;line-height:1.4;
  }

  .foot{
    display:flex;align-items:center;gap:10px;
    margin-top:20px;font-size:12px;color:var(--muted);flex-wrap:wrap;
    justify-content:center;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;
       box-shadow:0 0 0 0 rgba(53,208,127,.6);animation:pulse 2s infinite}
  .dot.err{background:var(--accent2);animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(53,208,127,.55)}
    70%{box-shadow:0 0 0 9px rgba(53,208,127,0)}
    100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}
  }
  .sp{width:14px}
  button{
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;
    color:var(--text);background:rgba(255,255,255,.07);
    border:1px solid var(--line);border-radius:9px;padding:6px 11px;
  }
  button:hover{background:rgba(255,255,255,.13)}
  button:disabled{opacity:.45;cursor:default}

  .src{margin-top:14px;text-align:center;font-size:11px;color:#6b79a0;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid" id="app"></div>

  <div class="foot">
    <span class="dot" id="dot"></span>
    <span id="status">Connecting…</span>
    <span class="sp"></span>
    <span id="nextrefresh"></span>
    <button id="refresh" type="button">Refresh</button>
  </div>

  <div class="src">
    Citybus B3A · open data: rt.data.gov.hk (DATA.GOV.HK) · auto-refresh every 30s<br>
    outbound: Fu Tai Estate 003261 → Shenzhen Bay Port &nbsp;|&nbsp;
    return: Shenzhen Bay Port 003208 → Shan King Estate (via Fu Tai Shopping Centre 003262)
  </div>
</div>

<script>
(function () {
  "use strict";

  var CO = "CTB";
  var ROUTE = "B3A";
  var API = "https://rt.data.gov.hk/v2/transport/citybus/eta/" + CO + "/";
  var REFRESH_MS = 30000;

  var LEGS = [
    {
      key: "out",
      kind: "去程 · Outbound",
      from: "Fu Tai Estate · 富泰邨",
      to: "Shenzhen Bay Port · 深圳灣口岸",
      tint: "#ffcc00",
      stop: "003261",
      dir: "O",
      dest: "Shenzhen Bay Port",
      note: ""
    },
    {
      key: "ret",
      kind: "回程 · Return",
      from: "Shenzhen Bay Port · 深圳灣口岸",
      to: "Fu Tai · 富泰",
      tint: "#4cc9f0",
      stop: "003208",
      dir: "I",
      dest: "Shan King Estate",
      note: "Return direction terminates at Shan King Estate (山景邨). Nearest stop " +
            "to Fu Tai Estate is Fu Tai Shopping Centre · 富泰商場 (003262)."
    }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var busy = false;
  var lastUpdate = null;
  var nextFetchAt = 0;

  /* ---------- build cards once ---------- */
  var app = $("app");
  LEGS.forEach(function (leg) {
    var sec = document.createElement("section");
    sec.className = "card";
    sec.style.setProperty("--tint", leg.tint);
    sec.innerHTML =
      '<div class="top">' +
        '<div class="route">' + ROUTE + '</div>' +
        '<div class="dest">' +
          '<div class="kind">' + leg.kind + '</div>' +
          '<div class="leg"><span class="lbl">From</span><span>' + leg.from + '</span></div>' +
          '<div class="leg to"><span class="lbl">To</span><span>' + leg.to + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="hero">' +
        '<div class="label">Next B3A</div>' +
        '<div class="big">–</div>' +
        '<div class="unit">minutes</div>' +
        '<div class="at"></div>' +
      '</div>' +
      '<div class="list"></div>' +
      '<div class="err-box"></div>' +
      (leg.note ? '<div class="note">' + leg.note + '</div>' : '');

    app.appendChild(sec);

    leg.etas = [];
    leg.ui = {
      big:  sec.querySelector(".big"),
      unit: sec.querySelector(".unit"),
      at:   sec.querySelector(".at"),
      list: sec.querySelector(".list"),
      err:  sec.querySelector(".err-box")
    };
  });

  /* ---------- helpers ---------- */
  function clockOf(ms) {
    var d = new Date(ms);
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }
  function minsUntil(ms) { return (ms - Date.now()) / 60000; }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function badge(rmk) {
    return rmk ? '<span class="pill">' + esc(rmk) + "</span>" : "";
  }

  /* ---------- fetch ---------- */
  function fetchAll() {
    if (busy) return;
    busy = true;
    $("refresh").disabled = true;

    var jobs = LEGS.map(function (leg) {
      var url = API + leg.stop + "/" + ROUTE;
      return fetch(url, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (json) {
          leg.etas = ((json && json.data) || [])
            .filter(function (e) {
              return e.dir === leg.dir && e.dest_en === leg.dest && e.eta;
            })
            .map(function (e) {
              return { ms: new Date(e.eta).getTime(), rmk: e.rmk_en || e.rmk_tc || "" };
            })
            .filter(function (e) { return !isNaN(e.ms); })
            .sort(function (a, b) { return a.ms - b.ms; });
          leg.ui.err.style.display = "none";
          leg.ok = true;
        })
        .catch(function (err) {
          leg.ok = false;
          leg.err = err.message;
          leg.ui.err.style.display = "block";
          leg.ui.err.textContent =
            "Could not reach Citybus open data (" + err.message +
            "). Showing the last known times.";
        });
    });

    Promise.all(jobs).then(function () {
      lastUpdate = new Date();
      nextFetchAt = Date.now() + REFRESH_MS;

      var allOk = LEGS.every(function (l) { return l.ok; });
      $("dot").classList.toggle("err", !allOk);

      tick();
      busy = false;
      $("refresh").disabled = false;
    });
  }

  /* ---------- render ---------- */
  function renderLeg(leg) {
    var ui = leg.ui, etas = leg.etas;

    if (!etas.length) {
      ui.big.textContent = "–";
      ui.big.classList.remove("due");
      ui.unit.innerHTML = "no buses scheduled";
      ui.at.textContent = "";
      ui.list.innerHTML = '<div class="empty">No upcoming buses reported for this stop.</div>';
      return;
    }

    var first = etas[0];
    var m = minsUntil(first.ms);

    if (m <= 0.5) {
      ui.big.textContent = "Due";
      ui.big.classList.add("due");
      ui.unit.innerHTML = badge(first.rmk);
      ui.at.textContent = "arriving now";
    } else {
      ui.big.classList.remove("due");
      ui.big.textContent = Math.floor(m);
      ui.unit.innerHTML = "minutes" + badge(first.rmk);
      ui.at.textContent = "expected " + clockOf(first.ms);
    }

    var html = "";
    etas.slice(0, 4).forEach(function (e, i) {
      var mm = minsUntil(e.ms);
      var label = mm <= 0.5 ? "Due" : Math.floor(mm) + "<small>min</small>";
      html += '<div class="row">' +
                '<span class="n">' + (i + 1) + "</span>" +
                '<span class="min">' + label + badge(e.rmk) + "</span>" +
                '<span class="clock">' + clockOf(e.ms) + "</span>" +
              "</div>";
    });
    ui.list.innerHTML = html;
  }

  /* ---------- tick ---------- */
  function tick() {
    if (!lastUpdate) return;
    LEGS.forEach(renderLeg);

    $("status").textContent =
      ($("dot").classList.contains("err") ? "Partial data" : "Live") +
      " · updated " +
      String(lastUpdate.getHours()).padStart(2, "0") + ":" +
      String(lastUpdate.getMinutes()).padStart(2, "0") + ":" +
      String(lastUpdate.getSeconds()).padStart(2, "0");

    var left = Math.max(0, Math.ceil((nextFetchAt - Date.now()) / 1000));
    $("nextrefresh").textContent = "next in " + left + "s";
  }

  $("refresh").addEventListener("click", fetchAll);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) fetchAll();
  });

  fetchAll();
  setInterval(tick, 1000);
  setInterval(fetchAll, REFRESH_MS);
})();
</script>
</body>
</html>
